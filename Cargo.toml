[workspace]
resolver = "2"
members = ["crates/seat-udev"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["poll"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
udev = "0.9.3"
uuid = { version = "1", features = ["v4"] }
